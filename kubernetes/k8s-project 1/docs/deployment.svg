<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" role="img" aria-labelledby="title"><title id="title">Deployment workflow</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#94a3b8"/></marker></defs><rect width="960" height="980" rx="16" fill="#0f172a"/><text x="40" y="45" fill="#f8fafc" font-family="Arial,sans-serif" font-size="25" font-weight="bold">Deployment workflow</text><path d="M480,159 L480,215" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480,289 L480,345" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480,419 L480,475" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480,549 L480,605" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480,679 L480,735" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480,809 L480,865" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><g><rect x="335" y="85" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="480" y="114" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">1. terraform init</text><text x="480" y="136" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Load backend, modules and providers</text></g><g><rect x="335" y="215" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="480" y="244" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">2. terraform validate</text><text x="480" y="266" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Check configuration</text></g><g><rect x="335" y="345" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="480" y="374" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">3. terraform plan</text><text x="480" y="396" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Review proposed changes</text></g><g><rect x="335" y="475" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="480" y="504" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">4. terraform apply</text><text x="480" y="526" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Approve reviewed changes</text></g><g><rect x="335" y="605" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="480" y="634" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">5. Provision infrastructure</text><text x="480" y="656" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Networking / EKS / IAM</text></g><g><rect x="335" y="735" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="480" y="764" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">6. Install Helm releases</text><text x="480" y="786" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Ingress / certificates / DNS controllers</text></g><g><rect x="335" y="865" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="480" y="894" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">7. Verify with kubectl</text><text x="480" y="916" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Check nodes, pods and services</text></g></svg>