<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" role="img" aria-labelledby="title"><title id="title">EKS lab architecture</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#94a3b8"/></marker></defs><rect width="960" height="980" rx="16" fill="#0f172a"/><text x="40" y="45" fill="#f8fafc" font-family="Arial,sans-serif" font-size="25" font-weight="bold">EKS lab architecture</text><path d="M480,159 L165,215" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480,159 L795,215" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480,159 L480,345" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M795,289 L480,345" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480,419 L165,475" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480,419 L795,475" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480,419 L165,605" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M795,549 L795,605" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M795,679 L795,735" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M795,809 L795,865" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><g><rect x="335" y="85" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="480" y="114" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Engineer + Terraform CLI</text><text x="480" y="136" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">AWS credentials / us-east-1</text></g><g><rect x="20" y="215" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="165" y="244" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">S3 remote state</text><text x="165" y="266" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">eks-tfstate-siema / eks-lab</text></g><g><rect x="650" y="215" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="795" y="244" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">VPC / three Availability Zones</text><text x="795" y="266" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Public + private subnets / one NAT</text></g><g><rect x="335" y="345" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="480" y="374" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">EKS control plane / 1.33</text><text x="480" y="396" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">API restricted to allowed CIDR</text></g><g><rect x="20" y="475" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="165" y="504" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Private managed worker nodes</text><text x="165" y="526" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Desired: 1 / scaling: 1 to 2</text></g><g><rect x="650" y="475" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="795" y="504" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Helm provider</text><text x="795" y="526" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">AWS EKS token authentication</text></g><g><rect x="20" y="605" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="165" y="634" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">CloudWatch control plane logs</text><text x="165" y="656" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">API / audit / authenticator</text></g><g><rect x="650" y="605" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="795" y="634" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">NGINX / cert-manager</text><text x="795" y="656" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">external-dns</text></g><g><rect x="650" y="735" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="795" y="764" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">OIDC + IRSA roles</text><text x="795" y="786" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Scoped Route 53 permissions</text></g><g><rect x="650" y="865" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="795" y="894" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Existing Route 53 hosted zone</text><text x="795" y="916" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">DNS updates / DNS challenges</text></g></svg>