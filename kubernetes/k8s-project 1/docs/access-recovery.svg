<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" role="img" aria-labelledby="title"><title id="title">Recover access after a public IP change</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#94a3b8"/></marker></defs><rect width="960" height="790" rx="16" fill="#0f172a"/><text x="40" y="45" fill="#f8fafc" font-family="Arial,sans-serif" font-size="25" font-weight="bold">Recover access after a public IP change</text><path d="M480,159 L165,245" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="334.5" y="202" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="13">Yes</text><path d="M480,159 L795,245" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="649.5" y="202" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="13">No</text><path d="M165,319 L165,385" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M165,459 L165,525" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M165,599 L165,665" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><g><rect x="335" y="85" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="480" y="114" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Helm refresh cannot reach EKS</text><text x="480" y="136" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Check public IPv4 and live allowlist</text></g><g><rect x="20" y="245" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="165" y="274" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">IP changed</text><text x="165" y="296" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Update my_public_ip_cidr</text></g><g><rect x="650" y="245" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="795" y="274" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">IP matches allowlist</text><text x="795" y="296" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Check VPN / firewall / DNS / routing</text></g><g><rect x="20" y="385" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="165" y="414" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Plan only the EKS cluster resource</text><text x="165" y="436" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Review the targeted recovery plan</text></g><g><rect x="20" y="525" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="165" y="554" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Apply the saved recovery plan</text><text x="165" y="576" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Wait for cluster-active</text></g><g><rect x="20" y="665" width="290" height="74" rx="10" fill="#163047" stroke="#38bdf8"/><text x="165" y="694" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Run a full terraform plan</text><text x="165" y="716" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15">Resume normal deployment workflow</text></g></svg>